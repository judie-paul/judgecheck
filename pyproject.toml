[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "judgecheck"
version = "0.1.0.dev0"
description = "Measure how far LLM judges agree with MT-Bench expert judgments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "typer>=0.12", "PyYAML>=6"]

[project.scripts]
judgecheck = "judgecheck.cli:app"

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24", "pandas>=2.2", "pyarrow>=15"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "build>=1.2", "twine>=6", "pre-commit>=4", "types-PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/judgecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=judgecheck --cov-report=term-missing --cov-fail-under=85"
markers = ["network: downloads the pinned dataset; excluded by default"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "huggingface_hub.*"]
ignore_missing_imports = true
