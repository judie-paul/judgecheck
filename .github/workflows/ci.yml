name: Python quality
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,llm]'
      - run: make PYTHON=python lint typecheck test ingest pipeline
      - run: python -m build
      - run: python -m twine check dist/*
